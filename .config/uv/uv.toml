# Supply chain hardening
# https://docs.astral.sh/uv/reference/settings/

# Skip releases under 3 days old, so compromised ones get spotted first.
# Accepts "3 days", RFC 3339 timestamps or ISO 8601 (P3D).
# Override: --exclude-newer "" or per-project uv.toml
exclude-newer = "3 days"

# Refuse source distributions: no setup.py or build-backend code runs at
# install (build-time RCE). Most packages ship macOS arm64 wheels.
# Override: --no-build false or per-project uv.toml
no-build = true

# TODO: enable Sigstore attestation verification when shipped (PEP 740
# install-side verification):
#   https://github.com/astral-sh/uv/issues/9122
