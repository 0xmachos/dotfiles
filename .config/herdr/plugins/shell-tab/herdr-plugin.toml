# Local herdr plugin, linked from the repo by `bittersweet dotfiles`. It runs
# one reconcile script on server startup, on the events that add or remove
# an agent from a tab, and as an action: herdr plugin action invoke reconcile
# --plugin local.shell-tab. Not on tab.renamed (its own renames would loop).
id = "local.shell-tab"
name = "Shell tab"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Name a tab shell while no pane in it runs an agent"
platforms = ["macos"]

[[startup]]
command = ["./shell-tab"]

[[events]]
on = "tab.created"
command = ["./shell-tab"]

[[events]]
on = "pane.agent_detected"
command = ["./shell-tab"]

[[events]]
on = "pane.closed"
command = ["./shell-tab"]

[[events]]
on = "pane.moved"
command = ["./shell-tab"]

[[actions]]
id = "reconcile"
title = "Reconcile shell tab names"
contexts = ["global"]
command = ["./shell-tab"]
