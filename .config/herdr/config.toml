onboarding = false
# herdr config — symlinked to ~/.config/herdr/config.toml by `bittersweet
# dotfiles`. Only this file is linked; herdr keeps its socket, session.json,
# session-backups/, machine.json, push registries and guest audit log beside
# it, none of it for the repo.
#
# herdr edits this file itself (onboarding, theme, sound, toast, integrations)
# with std::fs::write, and its integration installer resolves symlinks before
# replacing, so both write through the link (source read 2026-09-29, fork
# commit 4e6bacf). Expect a tracked-file diff after the first run.

# Remote push defaults to a third-party relay ("auto" falls back to it when no
# APNs key is configured; none is here) that sees notification text in
# transit. Off until that is an explicit decision (2026-09-29); "relay" opts in.
[push]
mode = "off"

[theme]
name = "terminal"
auto_switch = false

# Status colours (red = blocked, yellow = working, teal = done, green = idle):
# the terminal palette's dark ANSI values sat too close together.
[theme.custom]
red = "#ff5c5c"
yellow = "#ffd166"
teal = "#4ecdc4"
green = "#7ee787"

[update]
channel = "preview"

[ui]
status_indicators = "symbols"
hide_tab_bar_when_single_tab = false
# Attention queue: blocked agents first, then working, then done.
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true
prompt_new_tab_name = false
# Ghostty's tab bar shows this title; the default leads with the hostname.
window_title = "{workspace} › {tab}"

# Right end of the tab bar: zoom marker, branch with changed-file count of the
# focused pane's repo (sidebar git status shows only ahead/behind), the time.
# The command runs on the herdr server every few seconds.
tab_bar_right = [
  { type = "zoom" },
  { type = "command", command = 'd="${HERDR_ACTIVE_PANE_CWD:-.}"; n=-1; b=""; git --no-optional-locks -C "$d" status --porcelain=v1 --branch 2>/dev/null | { while IFS= read -r l; do n=$((n+1)); [ "$n" -eq 0 ] && b="${l#\#\# }"; done; case "$b" in "HEAD (no branch)"|"") ;; *) echo "${b%%...*} ~$n";; esac; }', interval_seconds = 15, timeout_seconds = 2 },
  { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = " · "

# macOS notifications when a background agent needs attention or finishes.
# Herdr UI posts them as itself (Notification Center, a click opens the pane);
# a TUI client asks the OS directly. The other modes are herdr (in-app toasts),
# terminal (OSC 9/777 to the outer terminal) and off.
[ui.toast]
delivery = "system"

# Agent rows, two lines with no gap between agents: a bold state mark and the
# session's terminal title (Claude Code keeps it updated) at full width, then
# the state word in the state colour and the session-wrap marker under the
# title. The pane token `wrap` is `wrapped` (purple) or `N blocked`
# (orange), set when the wrap finishes and cleared on the next prompt; an
# unset token takes no space. The `agent` token names the harness (muse,
# codex) in blue; Herdr UI draws that harness's icon on the line holding
# it, in the token's colour (muted grey when unset). Claude
# rows below leave it out, so only a non-Claude agent carries a marker.
[ui.sidebar.agents]
row_gap = 0
rows = [
  [
    { token = "state_icon", bold = true },
    { token = "terminal_title_stripped", bold = true },
  ],
  [
    { token = "state_text", bold = true },
    { token = "agent", bold = true, fg = "#82aaff" },
    { token = "$wrap", bold = true, rules = [{ equals = "wrapped", fg = "#c792ea" }, { contains = "blocked", fg = "#ff9e64" }] },
  ],
]

# Claude rows show the pane label instead: the herdr-tab-title mod sets it to
# the session title shortened to fit the Herdr UI sidebar width. A pane with
# no label shows no title, so other agents keep the rows above.
[ui.sidebar.agents.rows_by_agent]
claude = [
  [
    { token = "state_icon", bold = true },
    { token = "pane", bold = true },
  ],
  [
    { token = "state_text", bold = true },
    { token = "$wrap", bold = true, rules = [{ equals = "wrapped", fg = "#c792ea" }, { contains = "blocked", fg = "#ff9e64" }] },
  ],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  [{ token = "state_icon" }, { token = "workspace", bold = true }],
  [{ token = "branch" }, { token = "git_status" }],
]

# Reopen each Claude session in its own conversation after a server restart.
[session]
resume_agents_on_restore = true

# Direct alt chords (left Option, per Ghostty macos-option-as-alt = left).
[keys]
previous_tab = "alt+["
next_tab = "alt+]"
switch_tab = "alt+1..9"
previous_workspace = "alt+shift+["
next_workspace = "alt+shift+]"
switch_workspace = "alt+shift+1..9"
