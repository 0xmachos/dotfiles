onboarding = false
# herdr config — symlinked to ~/.config/herdr/config.toml by `bittersweet
# dotfiles`. Only this file is linked; herdr keeps its socket, session.json,
# session-backups/, machine.json, push registries and guest audit log beside
# it, and none of that belongs in the repo.
#
# herdr edits this file itself (onboarding, theme, sound, toast, integrations)
# with std::fs::write and its integration installer resolves symlinks before
# replacing, so both paths write through the link (read from source 2026-09-29,
# fork commit 4e6bacf). Expect a tracked-file diff after the first run.

# Remote push goes through a third-party relay by default ("auto" falls back to
# the relay whenever no APNs key is configured, and there is no key here). The
# relay sees notification text in transit. Off until that is an explicit
# decision (2026-09-29); set to "relay" to opt in.
[push]
mode = "off"

[theme]
name = "terminal"
auto_switch = false

[update]
channel = "preview"

[ui]
status_indicators = "symbols"
hide_tab_bar_when_single_tab = true
show_agent_labels_on_pane_borders = true
prompt_new_tab_name = false
# Ghostty's tab bar shows this title; the default leads with the hostname.
window_title = "{workspace} › {tab}"

# Ask Ghostty (OSC 9/777) for a macOS notification when a background agent
# needs attention or finishes; in-app toasts and system delivery are the
# other two modes.
[ui.toast]
delivery = "terminal"

# Agent rows follow each session's own terminal title, which Claude Code keeps
# updated, instead of a fixed directory name.
[ui.sidebar.agents]
row_gap = 1
rows = [
  [{ token = "state_icon" }, { token = "workspace", bold = true }],
  [{ token = "terminal_title_stripped" }],
]

[ui.sidebar.spaces]
row_gap = 1
rows = [
  [{ token = "state_icon" }, { token = "workspace", bold = true }],
  [{ token = "branch" }, { token = "git_status" }],
]

# Direct alt chords (left Option, per Ghostty macos-option-as-alt = left).
[keys]
previous_tab = "alt+["
next_tab = "alt+]"
switch_tab = "alt+1..9"
previous_workspace = "alt+shift+["
next_workspace = "alt+shift+]"
switch_workspace = "alt+shift+1..9"

# Splits on the Cmd chords. Ghostty unbinds them (see its config) so the keys
# reach herdr instead of splitting Ghostty's own window.
split_vertical = "cmd+d"
split_horizontal = "cmd+shift+d"
